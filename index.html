<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee6">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Your guitar songbook: chords over lyrics, chord shapes, autoscroll, tuner. Works offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TabIt">
  <meta name="robots" content="noindex">
  <title>TabIt</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    // theme before first paint, so dark mode never flashes white
    try {
      var t = (JSON.parse(localStorage.getItem('tabit.prefs')) || {}).theme;
      if (t && t !== 'system') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="root" class="splash" aria-busy="true"><img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:18px"></div>
  <noscript><p style="padding:24px">TabIt needs JavaScript.</p></noscript>
</body>
</html>
