<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee6">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Your guitar songbook: chords over lyrics, chord shapes, autoscroll, tuner. Works offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TabIt">
  <meta name="robots" content="noindex">
  <title>TabIt</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    // theme before first paint, so dark mode never flashes white
    try {
      var t = (JSON.parse(localStorage.getItem('tabit.prefs')) || {}).theme;
      if (t && t !== 'system') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/splash.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="root" class="splash" aria-busy="true">
    <div class="splash-in">
      <img class="splash-logo" src="icons/icon-192.png" alt="" width="76" height="76">
      <svg class="splash-strings" viewBox="0 0 132 62" aria-hidden="true">
        <line x1="4" y1="6" x2="128" y2="6" stroke-width="1.1" style="--i:0"/>
        <line x1="4" y1="16" x2="128" y2="16" stroke-width="1.3" style="--i:1"/>
        <line x1="4" y1="26" x2="128" y2="26" stroke-width="1.6" style="--i:2"/>
        <line x1="4" y1="36" x2="128" y2="36" stroke-width="1.9" style="--i:3"/>
        <line x1="4" y1="46" x2="128" y2="46" stroke-width="2.3" style="--i:4"/>
        <line x1="4" y1="56" x2="128" y2="56" stroke-width="2.7" style="--i:5"/>
        <path class="pick" d="M0-9C6-9 9-6 8-2 7 3 3 8 0 10-3 8-7 3-8-2-9-6-6-9 0-9Z"/>
      </svg>
      <p class="splash-pun" aria-live="polite"></p>
    </div>
  </div>
  <noscript><p style="padding:24px">TabIt needs JavaScript.</p></noscript>
</body>
</html>
